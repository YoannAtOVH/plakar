# Connector packages (.ptar) on GitHub, aligned with the release tags of
# upstream plakar.
#
# Meant for a fork of PlakarKorp/plakar that carries packaging/ptar.  The fork's
# own plakar sources are not used: plakar is built from a tag of
# PlakarKorp/plakar, checked out below, so the packages are assembled by the very
# release they are meant for.  The recipes and build-ptar.sh come from the fork.
# Each run uploads one artifact, ptar-<tag>, holding the packages and their
# checksums; `gh run download --name ptar-<tag>` fetches the latest one.  An
# artifact needs an account to download, so a run can also publish the packages
# as the release ptar-<tag> (see release.sh), whose assets anyone can fetch: the
# scheduled run does, a manual one does with -f publish=true.
#
#     gh workflow run ptar.yml                         # newest stable upstream tag
#     gh workflow run ptar.yml -f plakar_ref=v1.1.6    # another tag
#     gh run download --name ptar-v1.1.7               # fetch the packages
#     gh workflow run ptar.yml -f runner=ubuntu-26.04  # try another runner image
#     gh workflow run ptar.yml -f publish=true         # build, then release ptar-<tag>
#
# Two things about the fork, both deliberate:
#   * workflow_dispatch and schedule only work from the default branch, so the
#     branch that carries this file has to be the default branch.
#   * do not push upstream's v* tags to it: .github/workflows/release.yml would
#     run GoReleaser on each of them.  Nothing here needs them -- the tag is read
#     from PlakarKorp/plakar directly.
#
# The smoke test in build-ptar.sh installs with `pkg add -allow-unsigned`, a flag
# plakar has had since v1.1.5: older tags cannot be packaged this way.

name: ptar

on:
  workflow_dispatch:
    inputs:
      plakar_ref:
        description: 'Tag (or branch) of PlakarKorp/plakar to build with. Empty: the newest stable tag.'
        required: false
        default: ''
      recipes:
        description: 'Recipes to package, space separated. Empty: all of them.'
        required: false
        default: ''
      platforms:
        description: 'Targets, space separated os/arch.'
        required: false
        default: 'linux/amd64 darwin/arm64 windows/amd64'
      runner:
        description: 'Runner label to run on, e.g. ubuntu-26.04 to try the next ubuntu-latest ahead of its migration.'
        required: false
        default: 'ubuntu-latest'
      publish:
        description: 'Publish the packages as the GitHub release ptar-<tag> once built (the scheduled run always does).'
        type: boolean
        required: false
        default: false
  schedule:
    # Daily, off the hour.  Builds and publishes the newest stable upstream tag
    # unless its release already exists.
    - cron: '23 5 * * *'
  push:
    branches:
      - ptar-packaging
    paths:
      - packaging/ptar/**
      - '!packaging/ptar/README.md'
      - .github/workflows/ptar.yml

permissions:
  contents: read

defaults:
  run:
    # bash, for pipefail.
    shell: bash

env:
  UPSTREAM_REPO: PlakarKorp/plakar
  # Keep in step with ARG GO_IMAGE in packaging/ptar/Dockerfile.  The floor is
  # the webdav connector's go.mod (go 1.26.2); GOTOOLCHAIN=local makes a plugin
  # that outgrows it fail loudly instead of downloading a toolchain behind our
  # back.
  GO_VERSION: '1.26.5'
  GOTOOLCHAIN: local

jobs:
  resolve:
    name: resolve the upstream tag
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read # to look for an existing release
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      slug: ${{ steps.pick.outputs.slug }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick the tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.plakar_ref }}
        run: |
          upstream=https://github.com/$UPSTREAM_REPO.git

          ref=${INPUT_REF:-}
          if [ -z "$ref" ]; then
            # The newest stable release: vX.Y.Z, no pre-release suffix.
            ref=$(git ls-remote --tags --refs "$upstream" 'refs/tags/v*' |
              sed 's|.*refs/tags/||' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V | tail -n 1) || true
          fi
          if [ -z "$ref" ]; then
            echo "::error::no stable v* tag found on $UPSTREAM_REPO"
            exit 1
          fi

          # An explicit ref has to exist upstream, as a tag or as a branch.
          if ! git ls-remote --exit-code "$upstream" \
            "refs/tags/$ref" "refs/heads/$ref" >/dev/null; then
            echo "::error::$ref is neither a tag nor a branch of $UPSTREAM_REPO"
            exit 1
          fi

          # Artifact names cannot hold a slash.
          slug=${ref//\//-}

          # The scheduled run only has something to do for a tag that has no
          # release yet.  A release does not expire, unlike an artifact.
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
            gh release view "ptar-$slug" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
            echo "The release ptar-$slug already exists, nothing to build." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "ref=$ref"
            echo "slug=$slug"
            echo "build=$build"
          } >>"$GITHUB_OUTPUT"
          echo "plakar $ref, build=$build"

  ptar:
    name: ptar-${{ needs.resolve.outputs.slug }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      plakar_version: ${{ steps.version.outputs.version }}
    env:
      PLAKAR_REF: ${{ needs.resolve.outputs.ref }}
    steps:
      # The packaging comes from this repository...
      - name: Check out the packaging
        uses: actions/checkout@v7
        with:
          path: fork
          sparse-checkout: packaging/ptar

      # ...and plakar from upstream, at the tag the packages are meant for.
      - name: Check out plakar at ${{ needs.resolve.outputs.ref }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: plakar

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: plakar/go.sum

      # What the build leans on, so that a change of runner image shows in the
      # log rather than in a puzzling failure.
      - name: Show the runner
        run: |
          {
            grep '^PRETTY_NAME=' /etc/os-release
            echo "image $ImageOS $ImageVersion; /bin/sh is $(readlink -f /bin/sh)"
            git --version
            make --version
            sort --version
            sha256sum --version
            gh --version
            go version
          } 2>&1 | grep -E '^(PRETTY_NAME|image|git version|GNU Make|sort |sha256sum |gh version|go version)'

      - name: Build plakar
        working-directory: plakar
        run: |
          mkdir -p "$HOME/.local/bin"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$HOME/.local/bin/plakar" .
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      # The version is a constant in the sources, set by the commit a release is
      # tagged on, so a build of tag vX.Y.Z reports plakar/vX.Y.Z.  Say so if it
      # does not: the packages would then not be what their name claims.
      - name: Check that plakar is the release it should be
        id: version
        run: |
          state=$RUNNER_TEMP/plakar-version
          got=$(plakar -configdir "$state" -cachedir "$state" -datadir "$state" version | tail -n 1)
          echo "plakar built from $PLAKAR_REF reports: $got"
          echo "version=$got" >>"$GITHUB_OUTPUT"
          case $PLAKAR_REF in
          v[0-9]*.[0-9]*.[0-9]*)
            if [ "$got" != "plakar/$PLAKAR_REF" ]; then
              echo "::warning::plakar reports $got, not plakar/$PLAKAR_REF"
            fi
            ;;
          esac

      - name: Package the connectors
        env:
          RECIPE_DIR: ${{ github.workspace }}/fork/packaging/ptar/recipes
          OUT_DIR: ${{ github.workspace }}/dist/plugins
          PTAR_STATE_DIR: ${{ runner.temp }}/plakar-state
          # Empty on every event but workflow_dispatch.
          PTAR_PLATFORMS: ${{ inputs.platforms || 'linux/amd64 darwin/arm64 windows/amd64' }}
          RECIPES: ${{ inputs.recipes }}
        run: |
          # Deliberate word splitting: RECIPES is a space separated list.
          # shellcheck disable=SC2086
          fork/packaging/ptar/build-ptar.sh $RECIPES

      # Since v4, upload-artifact refuses a second artifact of the same name
      # within one run; overwrite lets "Re-run jobs" replace it.  A new run
      # starts clean and adds its own ptar-<tag> next to the older ones, which
      # expire on their own.
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: ptar-${{ needs.resolve.outputs.slug }}
          path: |
            dist/plugins/*.ptar
            dist/plugins/*.ptar.sha256
          if-no-files-found: error
          # A .ptar is already compressed; zipping it again only costs time.
          compression-level: 0
          retention-days: 90
          overwrite: true

      - name: Summarise
        run: |
          {
            echo "### Connector packages, built with plakar $PLAKAR_REF"
            echo
            echo '| package | size | sha256 |'
            echo '| --- | --- | --- |'
            for f in dist/plugins/*.ptar; do
              printf "| \`%s\` | %s | \`%s\` |\n" "${f##*/}" \
                "$(du -h "$f" | cut -f1)" "$(cut -d' ' -f1 "$f.sha256")"
            done
          } >>"$GITHUB_STEP_SUMMARY"

  # Hand the packages out: an artifact needs an account to be downloaded, an asset
  # of a release in a public repository does not.  Only on the scheduled run or on
  # request, and only for a plakar release tag (release.sh refuses anything else).
  release:
    name: release ptar-${{ needs.resolve.outputs.slug }}
    needs: [resolve, ptar]
    if: needs.resolve.outputs.build == 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release, and the tag it creates
    # Two runs for the same tag must not race to create the same release.
    concurrency:
      group: ptar-release-${{ needs.resolve.outputs.slug }}
      cancel-in-progress: false
    steps:
      - name: Check out the packaging
        uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/ptar

      - name: Fetch the packages this run built
        uses: actions/download-artifact@v8
        with:
          name: ptar-${{ needs.resolve.outputs.slug }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ github.workspace }}/dist
          PLAKAR_REF: ${{ needs.resolve.outputs.ref }}
          PLAKAR_VERSION: ${{ needs.ptar.outputs.plakar_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: packaging/ptar/release.sh
